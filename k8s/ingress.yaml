apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard-web
  namespace: dashboard
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - host: dashboard.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard-web
                port:
                  number: 80
